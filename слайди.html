<!DOCTYPE html>
<html>
<head>
    <title>MENU</title>
    <style>
/* Загальний стиль для слайдера */
.slider {
  position: relative;
  width: 100%;
  max-width: 800px;
  height: 500px;
  overflow: hidden;
  border: 2px solid #ddd;
  border-radius: 8px;
  margin: auto;
}

/* Контейнер зі слайдами */
.slides {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform  ease;
}

/* Кожен слайд */
.slide {
  width: 100%;
  height: 100%;
  flex-shrink: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
  font-weight: bold;
  color: #fff;
  background: #555;
}

/* Кольори для слайдів */
#slide-1 { background: #ffffff; }
#slide-2 { background: #8e8e8e; }
#slide-3 { background: #1b1b1b; }

/* Навігація */
.navigation {
  position: absolute;
  width: 100%;
  top: 0px;
  display: flex;
  justify-content: center;
  gap: 10px;
  background-color: #ddd;
}

.navigation label {
  padding: 5px;
  border: 1px solid #4e4e4e;
  border-radius: 5%;
  background: #ddd;
  cursor: pointer;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  
}


/* Активний слайд */
input#slide1:checked ~ .slides {
  transform: translateX(0%);
}

input#slide2:checked ~ .slides {
  transform: translateX(-100%);
}

input#slide3:checked ~ .slides {
  transform: translateX(-200%);
}


    </style>

</head>
<body>

<div class="slider">
  <input type="radio" value="slide" name="slide" id="slide1" checked>
  <input type="radio" name="slide" id="slide2">
  <input type="radio" name="slide" id="slide3">

  <div class="slides">
    <div class="slide" id="slide-1">Slide 1 Content</div>
    <div class="slide" id="slide-2">Slide 2 Content</div>
    <div class="slide" id="slide-3">Slide 3 Content</div>
  </div>

  <div class="navigation">
    <label for="slide1">НОВИНКИ</label>
    <label for="slide2">ПОПУЛЯРНІ</label>
    <label for="slide3">АКЦІЇ</label>
  </div>
</div>

</body>
</html>
